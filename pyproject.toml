[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sis-planner"
version = "0.1.0"
description = "Capability-based planning and quality-based ranking of simulation sequences from SiS (Simulation Support) descriptions"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jonathan Reif" }]
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.0",
    "z3-solver>=4.12.2",
    "pyoxigraph>=0.4",
    "typer>=0.12",
    "requests>=2.31",
]

[project.scripts]
sis-planner = "sis_planner.cli:main"

[tool.setuptools.packages.find]
include = ["sis_planner*", "smt_planning*"]

[tool.setuptools.package-data]
"sis_planner.schema" = ["*.ttl"]
smt_planning = ["LICENSE"]
